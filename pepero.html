<!doctype html>

<style>
:root{ --ink:#2B2340; --ink2:#6B5A78 }
*{ box-sizing:border-box } html,body{ margin:0 }
body{ background:linear-gradient(180deg,#FFE9DD 0%,#FDF6EC 40%,#E3F6F1 100%) fixed; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:15px; line-height:1.6; -webkit-text-size-adjust:100%; min-height:100vh; min-height:100dvh }
[hidden]{ display:none !important }
#pep-app{ max-width:480px; margin:0 auto; padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)) }
.btn{ font-family:inherit; font-weight:800; font-size:14px; color:var(--ink); background:#FFE08A; padding:9px 14px; min-height:44px; cursor:pointer }
.btn.sm{ font-size:13px; padding:8px 12px }
.btn[disabled]{ cursor:default }
button:focus-visible, input:focus-visible{ outline:3px solid #6FD0EA; outline-offset:2px }
.pp-hero{ position:relative; border-radius:30px; overflow:hidden; aspect-ratio:4/3; background:#A9DBF5 url(img/pepero/bg.webp) center 62%/cover no-repeat;
  box-shadow:0 9px 0 #EAD3AE, 0 18px 30px rgba(90,60,120,.2); border:5px solid #fff }
.pp-hero::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(30,15,40,.42),rgba(30,15,40,0) 55%) }
.pp-hero div{ position:absolute; inset:auto 0 auto 0; top:16px; text-align:center; z-index:1; color:#fff; text-shadow:0 3px 14px rgba(30,15,40,.55) }
.pp-logo{ display:block; height:34px; width:auto; margin:0 auto 6px; filter:drop-shadow(0 2px 6px rgba(30,15,40,.5)) }
.pp-hero small{ display:block; font-weight:800; font-size:13px; color:#FFE2B8 }
.pp-hero h1{ margin:2px 0 0; font-size:27px; line-height:1.25; font-weight:900; word-break:keep-all }
.pp-card{ margin-top:22px; background:#FFF8EC; border-radius:26px; padding:16px; box-shadow:inset 0 -6px 0 #F1DDBA, inset 0 4px 0 #fff, 0 6px 0 #EAD3AE, 0 14px 24px rgba(90,60,30,.12) }
.pp-card h2{ margin:0 0 4px; font-size:18px; font-weight:900 } .pp-card p{ margin:0 0 10px; font-size:13.5px; color:var(--ink2); word-break:keep-all }
.pp-q{ width:100%; min-height:52px; font:inherit; font-size:17px; font-weight:700; border:0; border-radius:18px; padding:12px 16px; background:#fff; color:var(--ink);
  box-shadow:inset 0 3px 6px rgba(60,30,60,.12), 0 2px 0 #fff; -webkit-appearance:none }
.pp-list{ margin-top:6px } .pp-chips{ display:flex; flex-wrap:wrap; gap:8px }
.pp-grp{ margin:14px 0 8px; font-size:13px; font-weight:900; color:#C2456A }
.pp-name{ font:inherit; font-weight:800; font-size:15px; border:0; border-radius:16px; padding:10px 14px; min-height:46px; background:#fff; color:var(--ink); cursor:pointer;

.pp-name:active{ transform:translateY(3px) scale(.97) }
.pp-name small{ margin-left:5px; font-size:11px; font-weight:900; background:#C9B3FF; border-radius:999px; padding:1px 7px; vertical-align:2px }
.pp-again{ margin-top:14px; display:flex; justify-content:center }
.pp-tabs{ display:flex; gap:6px; background:#F3E6CF; border-radius:18px; padding:5px; margin:6px 0 14px }
.pp-tabs button{ flex:1; font:inherit; font-weight:900; font-size:15px; border:0; border-radius:14px; min-height:46px; background:transparent; color:var(--ink2); cursor:pointer }
.pp-tabs button[aria-selected="true"]{ background:#fff; color:var(--ink); box-shadow:inset 0 3px 0 #fff, 0 3px 0 #E2CFAE }
.pp-looks{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px }
.pp-look{ font:inherit; border:0; border-radius:22px; background:#fff; padding:10px 4px 8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:0;
  box-shadow:inset 0 -5px 0 rgba(60,30,60,.07), 0 5px 0 #E8D6B6; transition:transform .16s cubic-bezier(.3,1.7,.5,1) }
.pp-look img{ width:auto; height:150px; max-width:100%; object-fit:contain; filter:drop-shadow(0 6px 6px rgba(60,30,60,.18)) }
.pp-look span{ font-weight:900; font-size:13px; color:var(--ink) }
.pp-look.on{ background:#FFE1E8; transform:translateY(-4px); box-shadow:inset 0 -5px 0 rgba(200,60,100,.12), 0 9px 0 #E86F86, 0 0 0 3px #FF8FA3 }
.pp-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:2px; padding-right:58px }
.pp-top b{ font-size:14px; font-weight:900; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.pp-foot{ margin-top:18px; text-align:center; font-size:12.5px; color:var(--ink2) } .pp-foot a{ color:#C2456A; font-weight:800 }
.pp-by{ margin:2px 0 0; text-align:center } .pp-by a{ display:inline-flex; align-items:center; min-height:44px; padding:0 14px; font-size:12px; font-weight:700; color:var(--ink2); text-decoration:none; opacity:.85 } .pp-by a:hover, .pp-by a:focus-visible{ text-decoration:underline; opacity:1 }
.pp-demo{ margin:0 auto 10px; width:max-content; max-width:100%; background:#2B2340; color:#FFE08A; font-weight:900; font-size:12.5px; border-radius:999px; padding:5px 14px }
.pp-snd{ position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px; z-index:8; width:48px; height:48px; border:0; border-radius:50%; background:#fff; font-size:22px; cursor:pointer;
  box-shadow:inset 0 -4px 0 rgba(60,30,60,.1), inset 0 3px 0 #fff, 0 4px 0 #E8D6B6, 0 8px 16px rgba(90,60,120,.18) }
.pp-snd[aria-pressed="true"]{ background:#FFE1E8 }
.pp-gc{ position:fixed; inset:0; z-index:20; background:rgba(20,10,30,.82); display:flex; align-items:flex-start; justify-content:center; overflow:auto; padding:calc(16px + env(safe-area-inset-top)) 16px 24px }
.pp-gc-in{ width:100%; max-width:440px; background:#fff; border-radius:24px; padding:14px; text-align:center }
.pp-gc-in p{ margin:4px 0 10px; font-weight:900; font-size:17px; line-height:1.4 } .pp-gc-in small{ font-weight:700; font-size:13px; color:var(--ink2) }
.pp-gc-in img{ display:block; width:100%; height:auto; border-radius:12px; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; margin-bottom:12px }
.pep-open{ background:linear-gradient(180deg,#B8F2DA,#7FDDB6) !important; box-shadow:inset 0 -7px 0 rgba(20,110,80,.18), inset 0 5px 0 rgba(255,255,255,.55), 0 7px 0 #4FB98E, 0 14px 22px rgba(79,185,142,.3) !important }
.pp-letter{ width:100%; max-width:380px; text-align:center; border-radius:22px; padding:18px 18px 14px; color:#4A3558; word-break:keep-all;
  background:#FFFBF2 repeating-linear-gradient(180deg, transparent 0 31px, rgba(200,170,140,.18) 31px 32px); box-shadow:inset 0 -5px 0 #F1E2C6, inset 0 3px 0 #fff, 0 6px 0 #EAD9BD, 0 12px 22px rgba(90,60,30,.12);
  font-family:"Nanum Pen Script","NanumPen","Gaegu","Apple SD Gothic Neo",cursive; transform:rotate(-1deg) }
.pp-letter p{ margin:0 0 6px; font-size:15px; line-height:1.7 } .pp-letter b{ display:block; margin:4px 0 8px; font-size:18px; line-height:1.55; color:#C2456A }
.pp-letter small{ display:block; margin-top:6px; font-size:12.5px; color:#8A6E7E }
.pp-toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--ink); color:#fff; font-weight:800; font-size:14px;
  border-radius:999px; padding:10px 18px; z-index:9; max-width:calc(100vw - 32px); text-align:center }
.pep-stage canvas{ display:block; margin:6px auto 0; height:min(58vh, calc((100vw - 40px) * 16 / 9)); max-width:100%; aspect-ratio:9/16; border:5px solid #fff; border-radius:30px; background:#A9DBF5; touch-action:manipulation;
  box-shadow:0 9px 0 #EAD3AE, 0 18px 30px rgba(90,60,120,.2) }
.pep-hint{ text-align:center; font-weight:900; font-size:15px; margin:16px 0 8px; min-height:1.3em; word-break:keep-all; color:#4A3558 }
.pep-ctl{ display:flex; flex-direction:column; align-items:center; gap:10px }
.pep-intro{ margin:0; font-size:14px; line-height:1.65; word-break:keep-all; text-align:center; color:#4A3558 } .pep-intro b{ display:block; font-size:16px; color:#E0607A; margin-bottom:2px }
#pep-app .btn{ border:0; border-radius:16px; box-shadow:inset 0 -4px 0 rgba(60,30,60,.12), inset 0 3px 0 rgba(255,255,255,.6), 0 4px 0 rgba(60,30,60,.18); transition:transform .14s cubic-bezier(.3,1.7,.5,1), box-shadow .14s }
#pep-app .btn:active{ transform:translateY(3px) scale(.97); box-shadow:inset 0 -2px 0 rgba(60,30,60,.12), inset 0 3px 0 rgba(255,255,255,.6), 0 1px 0 rgba(60,30,60,.18) }
#pep-app .btn.ghost{ background:#fff } #pep-app .btn.grape{ background:#C9B3FF; color:var(--ink) } #pep-app .btn.mint{ background:#A8EBCF } #pep-app .btn.sm:not(.grape):not(.mint):not(.ghost){ background:#FFE08A }
.pep-big{ width:100%; max-width:340px; min-height:60px; font-size:18px; font-weight:900; border-radius:24px !important; touch-action:manipulation; user-select:none; -webkit-user-select:none; color:var(--ink);
  background:linear-gradient(180deg,#FFB3C1,#FF8FA3) !important; box-shadow:inset 0 -7px 0 rgba(160,40,80,.18), inset 0 5px 0 rgba(255,255,255,.55), 0 7px 0 #D9677C, 0 14px 22px rgba(217,103,124,.3) !important }
.pep-big:active{ transform:translateY(6px) scale(.98); box-shadow:inset 0 -4px 0 rgba(160,40,80,.18), inset 0 5px 0 rgba(255,255,255,.55), 0 1px 0 #D9677C, 0 4px 10px rgba(217,103,124,.3) !important }
.pep-pad{ background:linear-gradient(180deg,#A6E6F5,#6FD0EA) !important; box-shadow:inset 0 -7px 0 rgba(30,100,140,.18), inset 0 5px 0 rgba(255,255,255,.55), 0 7px 0 #3FA6C8, 0 14px 22px rgba(63,166,200,.3) !important }
.pep-brag{ background:linear-gradient(180deg,#C9B3FF,#A98BFF) !important; box-shadow:inset 0 -7px 0 rgba(70,40,150,.2), inset 0 5px 0 rgba(255,255,255,.5), 0 7px 0 #7E5FD6, 0 14px 22px rgba(126,95,214,.32) !important; animation:pepPop .5s .2s cubic-bezier(.3,1.6,.5,1) both }
.pep-pull{ animation:pepWig .9s ease-in-out infinite }
@keyframes pepWig{ 0%,100%{ transform:rotate(0) } 20%{ transform:rotate(-2deg) scale(1.02) } 40%{ transform:rotate(2deg) scale(1.02) } 60%{ transform:rotate(0) } }
.pep-big[disabled]{ opacity:1; filter:saturate(.55) brightness(1.04) }
.pep-dots{ display:flex; gap:7px } .pep-dots i{ width:14px; height:14px; border-radius:50%; background:#fff; box-shadow:inset 0 -2px 0 rgba(60,30,60,.15), 0 2px 0 #E2CFAE } .pep-dots i.on{ background:#6FD0EA; box-shadow:inset 0 -2px 0 rgba(0,60,90,.2), inset 0 2px 0 rgba(255,255,255,.6), 0 2px 0 #3FA6C8 }
.pep-note{ display:block; text-align:center; color:#6B5A78; font-size:12px; word-break:keep-all }
.pep-res{ width:100%; max-width:380px; display:flex; gap:12px; align-items:center; text-align:left; border-radius:24px; background:#FFF8EC; padding:12px 16px;
  box-shadow:inset 0 -6px 0 #F1DDBA, inset 0 4px 0 #fff, 0 6px 0 #EAD3AE, 0 14px 24px rgba(90,60,30,.14); animation:pepPop .5s cubic-bezier(.3,1.6,.5,1) both }
.pep-res img{ flex:none; width:76px; height:76px; object-fit:contain; transform:rotate(-6deg) } .pep-res > div{ min-width:0 }
.pep-res span{ display:inline-block; background:#FFE08A; border-radius:999px; padding:2px 12px; font-weight:900; font-size:13px; box-shadow:inset 0 -2px 0 rgba(150,100,0,.18), 0 2px 0 #E7B640 }
.pep-res b{ display:block; font-size:20px; margin:5px 0 2px; word-break:keep-all; line-height:1.3 } .pep-res small{ color:#6B5A78; font-size:12.5px; word-break:keep-all }
@keyframes pepPop{ from{ transform:scale(.6); opacity:0 } to{ transform:none; opacity:1 } }
.pep-share{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; width:100% } .pep-share .btn{ flex:1 1 140px; max-width:220px }
.pep-vid{ width:100%; max-width:380px } .pep-prog{ height:14px; border-radius:999px; background:#fff; overflow:hidden; box-shadow:inset 0 2px 3px rgba(60,30,60,.15) } .pep-prog i{ display:block; height:100%; background:linear-gradient(90deg,#FFB3C1,#FF8FA3); border-radius:999px; transition:width .2s }
.pep-wall{ margin-top:18px; background:rgba(255,255,255,.6); border-radius:20px; padding:10px 12px; box-shadow:inset 0 2px 0 #fff, 0 4px 0 #EAD9BD } .pep-wall h4{ margin:0 0 6px; font-size:15px }
.pep-w{ display:flex; gap:8px; align-items:baseline; border-bottom:1px dashed rgba(107,90,120,.25); padding:6px 2px; font-size:13.5px } .pep-w:last-child{ border-bottom:0 } .pep-w b{ flex:none; max-width:30%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.pep-w span{ flex:1; min-width:0; word-break:keep-all } .pep-w small{ flex:none; color:#6B5A78; font-size:11.5px } .pep-w.me{ background:#FFF1C9; border-radius:10px }
@media (prefers-reduced-motion: reduce){ .pep-pull, .pep-res, .pep-brag{ animation:none } #pep-app .btn, .pep-big{ transition:none } }

#pep-app .pep-stage canvas{ height:min(62vh, calc((100vw - 42px) * 16 / 9)); cursor:pointer }
@media (prefers-reduced-motion: reduce){ .pp-name, .pp-look{ transition:none } }
</style>
</head>
<body>
<main id="pep-app">
  <p id="pp-demo" class="pp-demo" hidden>🎬 시연 모드 · 기록이 남지 않아요</p>
  <section id="pp-enter">
    <div class="pp-hero" role="img" aria-label="아침 해가 뜨는 낙산 해변, 의상대와 모래에 꽂힌 서프보드 네 개"><div><img class="pp-logo" src="img/pepero/logo-w.webp" alt="양양서핑학교" width="151" height="40"><small>11.11 · 양양서핑학교 서프 버디</small><h1>낙산 해변<br>빼빼로 선물</h1></div></div>
    <div class="pp-card">
      <h2>내 이름 찾기</h2>
      <p>나는 누구일까요? 명단에서 내 이름을 눌러 주세요. 한 이름에 한 번, 꽝은 없어요.</p>
      <input id="pp-q" class="pp-q" type="search" placeholder="이름을 적어 보세요" aria-label="이름 찾기" autocomplete="off" enterkeyhint="search">
      <div id="pp-list" class="pp-list"></div>
      <div id="pp-again" class="pp-again" hidden></div>
    </div>
  </section>
  <section id="pp-look" hidden>
    <div class="pp-top"><button type="button" class="btn sm ghost" data-pback>‹ 이름 바꾸기</button><b id="pp-who"></b></div>
    <div class="pp-card">
      <h2>캐릭터를 골라 주세요</h2>
      <p>낙산 해변을 함께 탐험할 내 캐릭터예요. 스토리 이미지에도 나와요.</p>
      
      <div id="pp-looks" class="pp-looks"></div>
    </div>
    <div class="pp-again"><button type="button" class="btn pep-big" data-plook>이 캐릭터로 출발 ›</button></div>
  </section>
  <section id="pp-play" hidden>
    <div class="pp-top"><button type="button" class="btn sm ghost" data-pback>‹ 처음으로</button><b id="pp-me"></b></div>
    <div class="pep-stage"><canvas id="pep-cv" role="img" aria-label="낙산 해변을 탐험하는 내 캐릭터와 바다가 보낸 선물상자"></canvas></div>
    <p id="pep-hint" class="pep-hint" aria-live="polite"></p><div id="pep-ctl" class="pep-ctl"></div><div id="pep-wall" class="pep-wall"></div>
  </section>
  <p class="pp-foot">양양서핑학교 6기 · <a href="/surfshare">SurfShare 열기</a></p>
  <p class="pp-by"><a href="https://ax.owenai.xyz" target="_blank" rel="noopener">만든 사람 · 에스에이치테크 ↗</a></p>
  <div id="pp-gc" class="pp-gc" role="dialog" aria-modal="true" aria-label="당첨된 기프티콘" hidden><div class="pp-gc-in">
    <p>매장에서 이 화면을 보여 주세요<br><small>화면 밝기를 올리면 잘 찍혀요</small></p>
    <img alt="당첨된 기프티콘" draggable="false" oncontextmenu="return false">
    <button type="button" class="btn pep-big" data-pgclose>닫기</button></div></div>
  <button type="button" id="pp-snd" class="pp-snd" aria-pressed="false" aria-label="배경 음악 켜기">🔇</button>
  <div id="pp-toast" class="pp-toast" role="status" hidden></div>
</main>
<script src="config.js"></script>
<script src="pepero-app.js"></script>
</body>
</html>
